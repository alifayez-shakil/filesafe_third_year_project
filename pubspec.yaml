name: filesafe
description: "FileSafe — Secure File Sharing"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Core
  cupertino_icons: ^1.0.8
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  shimmer: ^3.0.0
  provider: ^6.1.5+1
  
  # Navigation
  go_router: ^17.2.3
  
  # Backend & Auth
  supabase_flutter: ^2.5.6
  http: ^1.2.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.2
  
  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2
  
  # Media
  just_audio: ^0.10.2
  video_player: ^2.8.0
  flutter_pdfview: ^1.3.2
  
  # File handling
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  archive: ^4.0.2
  csv: ^6.0.0
  mime: ^1.0.0
  
  # Utilities
  connectivity_plus: ^6.0.0
  audio_session: ^0.1.21  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/